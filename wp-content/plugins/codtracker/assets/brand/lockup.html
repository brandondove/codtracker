<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CodTracker logo</title>
<style>
body{margin:0;background:#0b0d0e;color:#e4e4de;font-family:system-ui,sans-serif;padding:40px}
.stage{display:inline-block;padding:48px 40px;background:#131618;border:1px solid rgba(228,228,222,.12)}
.stage img{display:block;height:88px;width:auto}
.row{display:flex;gap:16px;align-items:end;margin-top:28px}
.plate{background:#eceae4;padding:10px;display:flex}
.dark{background:#0b0d0e;border:1px solid rgba(228,228,222,.12)}
p{color:#8b9195;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="stage"><img src="logo.svg" alt="CodTracker"></div>
<p>Favicon</p>
<div class="row">
<div class="plate"><img src="icon.svg" width="16" height="16" alt=""></div>
<div class="plate"><img src="icon.svg" width="32" height="32" alt=""></div>
<div class="plate dark"><img src="icon.svg" width="32" height="32" alt=""></div>
<div class="plate dark"><img src="icon.svg" width="48" height="48" alt=""></div>
</div>
</body>
</html>
